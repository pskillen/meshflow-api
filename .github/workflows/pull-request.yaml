name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-pin:
    runs-on: ubuntu-latest
    outputs:
      bot_ref: ${{ steps.pin.outputs.bot_ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read the pinned bot ref
        id: pin
        run: echo "bot_ref=$(tr -d '[:space:]' < .github/contract/bot-ref)" >> "$GITHUB_OUTPUT"

  contract:
    needs: contract-pin
    uses: ./.github/workflows/contract.yaml
    with:
      bot_ref: ${{ needs.contract-pin.outputs.bot_ref }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Meshflow/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Meshflow/requirements.dev.txt

      - name: Run linting
        run: |
          black . --check
          isort . --check-only
          flake8 .
        working-directory: Meshflow/

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          python -m pytest Meshflow/ -v --junit-xml=reports/junit.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        with:
          name: pytest
          path: reports/junit.xml
          reporter: python-xunit
        if: always()

  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      MESHFLOW_API_URL: http://localhost:8000
      MESHFLOW_NODE_API_KEY: integration-test-key-a1b2c3d4e5f6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Reads the layer cache that main builds write; PRs never write it, so they cannot churn it.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: meshflow-api:ci
          cache-from: type=gha,scope=meshflow-api

      # The compose services are tagged meshflow-api:ci, so --no-build reuses the image built above.
      - name: Launch stack
        run: docker compose -f docker-compose.test.yaml up -d --no-build

      - name: Smoke test
        run: |
          HEALTH_CHECK_URL="http://localhost:8000/api/status/"
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -s -f -o /dev/null "$HEALTH_CHECK_URL"; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Health check failed, retrying in 5 seconds..."
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "Health check failed after $MAX_RETRIES attempts"
          docker compose -f docker-compose.test.yaml logs api
          exit 1

      - name: Seed integration test data
        run: docker compose -f docker-compose.test.yaml run --rm api python manage.py seed_integration_tests

      - name: Set up Python for integration tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-integration.txt

      - name: Run integration tests
        run: |
          pip install -r tests/requirements-integration.txt
          mkdir -p reports
          pytest tests/integration/ -v --junit-xml=reports/integration-tests.xml

      - name: Integration Test Report
        uses: dorny/test-reporter@v3
        with:
          name: integration-tests
          path: reports/integration-tests.xml
          reporter: python-xunit
        if: always()

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yaml down -v
          docker system prune -f
