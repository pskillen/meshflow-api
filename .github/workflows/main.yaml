name: Release main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  contract-pin:
    runs-on: ubuntu-latest
    outputs:
      bot_ref: ${{ steps.pin.outputs.bot_ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read the pinned bot ref
        id: pin
        run: echo "bot_ref=$(tr -d '[:space:]' < .github/contract/bot-ref)" >> "$GITHUB_OUTPUT"

  contract:
    needs: contract-pin
    uses: ./.github/workflows/contract.yaml
    with:
      bot_ref: ${{ needs.contract-pin.outputs.bot_ref }}

  extract-dev-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Get short SHA
        id: get_sha
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "VERSION_LABEL=main-$SHORT_SHA" >> "$GITHUB_OUTPUT"

    outputs:
      VERSION_LABEL: ${{ steps.get_sha.outputs.VERSION_LABEL }}

  build:
    needs:
      - extract-dev-tag
    uses: ./.github/workflows/docker-build.yaml
    with:
      VERSION_LABEL: ${{ needs.extract-dev-tag.outputs.VERSION_LABEL }}
      ENVIRONMENT: dev 