[pytest]
DJANGO_SETTINGS_MODULE = Meshflow.settings.test
python_files = tests.py test_*.py *_tests.py
asyncio_mode = auto
addopts = 
    --reuse-db
    --cov=Meshflow
    --cov-report=term-missing
    --cov-report=html
    -v
markers =
    contract: replays the bot's capture subset through the bot serialiser and this API (needs MESHFLOW_BOT_PATH)
